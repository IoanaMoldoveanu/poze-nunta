<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Upload poze Nuntă</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --white: #ffffff;

      --background: #fbfaf8;
      --background-blue: #f5f9fc;

      --blue: #8db3d5;
      --blue-dark: #7098bb;
      --blue-soft: #eef5fa;

      --beige: #eadfd2;
      --beige-soft: #f7f3ee;

      --text: #343841;
      --text-soft: #727982;

      --border: #e4e8eb;

      --shadow:
        0 18px 55px rgba(55, 65, 75, 0.08);
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }


    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;

      overflow-x: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 8% 20%,
          rgba(141, 179, 213, 0.09),
          transparent 24%
        ),
        radial-gradient(
          circle at 92% 80%,
          rgba(234, 223, 210, 0.16),
          transparent 25%
        ),
        var(--background);
    }


    /* =======================================
       DECORAȚII FUNDAL
    ======================================= */

    .background-decoration {
      position: fixed;
      pointer-events: none;
      z-index: 0;

      width: 230px;
      height: 390px;

      opacity: 0.28;
    }

    .background-decoration.left {
      left: -45px;
      top: 90px;
    }

    .background-decoration.right {
      right: -40px;
      bottom: -45px;

      transform: rotate(180deg);
    }


    /* =======================================
       CONTAINER
    ======================================= */

    .container {
      position: relative;
      z-index: 2;

      width: min(760px, calc(100vw - 36px));

      background: rgba(255, 255, 255, 0.97);

      border: 1px solid rgba(55, 65, 75, 0.07);

      border-radius: 26px;

      padding: 27px 32px 20px;

      text-align: center;

      box-shadow: var(--shadow);
    }


    /* =======================================
       HEADER
    ======================================= */

    .eyebrow {
      margin-bottom: 11px;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.29em;
      text-transform: uppercase;

      color: var(--blue-dark);
    }


    .top-divider {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      width: 250px;
      max-width: 80%;

      margin: 0 auto 14px;
    }

    .top-divider::before,
    .top-divider::after {
      content: "";

      flex: 1;
      height: 1px;

      background: linear-gradient(
        to right,
        transparent,
        var(--beige)
      );
    }

    .top-divider::after {
      background: linear-gradient(
        to left,
        transparent,
        var(--beige)
      );
    }


    .heart {
      width: 19px;
      height: 19px;

      color: var(--blue);
    }


    h1 {
      margin: 0;

      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(42px, 5vw, 57px);
      font-weight: 400;
      line-height: 1;

      letter-spacing: -0.02em;

      color: var(--text);
    }


    .title-dot {
      width: 5px;
      height: 5px;

      margin: 13px auto 12px;

      border-radius: 50%;

      background: var(--beige);
    }


    .subtitle {
      max-width: 430px;

      margin: 0 auto;

      font-size: 16px;
      line-height: 1.45;

      color: var(--text-soft);
    }


    /* =======================================
       BUTOANE
    ======================================= */

    .button-group {
      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 18px;

      margin-top: 22px;
    }


    .btn-upload {
      min-width: 0;
      min-height: 178px;

      padding: 17px 17px 15px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: var(--white);

      border: 1px solid var(--border);

      border-radius: 18px;

      cursor: pointer;

      color: var(--text);

      box-shadow:
        0 7px 20px rgba(55, 65, 75, 0.045);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }


    .btn-upload:hover {
      transform: translateY(-2px);

      border-color: rgba(141, 179, 213, 0.55);

      box-shadow:
        0 12px 28px rgba(55, 65, 75, 0.08);
    }


    .btn-upload:active {
      transform: translateY(0);
    }


    /* icon */

    .icon-wrap {
      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 12px;

      border-radius: 50%;

      border: 1px solid rgba(141, 179, 213, 0.23);

      background: var(--blue-soft);

      color: var(--blue-dark);
    }


    .icon-wrap svg {
      width: 28px;
      height: 28px;

      stroke: currentColor;

      fill: none;

      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }


    .btn-title {
      margin-bottom: 5px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 20px;
      line-height: 1.2;

      font-weight: 600;

      color: var(--text);
    }


    .btn-subtitle {
      margin-bottom: 13px;

      font-size: 12.5px;
      line-height: 1.4;

      color: var(--text-soft);
    }


    /* banda albastră din partea de jos */

    .btn-action {
      width: 100%;

      padding: 9px 10px;

      border-radius: 7px;

      background:
        linear-gradient(
          135deg,
          #89afd1,
          #78a3c8
        );

      color: #ffffff;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 0.02em;

      text-transform: uppercase;

      box-shadow:
        0 4px 10px rgba(112, 152, 187, 0.16);
    }


    .hidden-input {
      display: none;
    }


    /* =======================================
       STATUS
    ======================================= */

    .status-card {
      min-height: 71px;

      margin-top: 18px;

      padding: 12px 18px;

      display: flex;

      align-items: center;

      text-align: left;

      gap: 14px;

      border: 1px solid rgba(141, 179, 213, 0.20);

      border-radius: 15px;

      background:
        linear-gradient(
          100deg,
          rgba(238, 245, 250, 0.68),
          rgba(247, 243, 238, 0.24)
        );
    }


    .status-icon {
      width: 43px;
      height: 43px;

      flex: 0 0 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #ffffff;

      border: 1px solid rgba(141, 179, 213, 0.28);

      color: var(--blue-dark);
    }


    .status-icon svg {
      width: 23px;
      height: 23px;

      stroke: currentColor;

      fill: none;

      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }


    .status-content {
      min-width: 0;
    }


    #status {
      font-family: Georgia, "Times New Roman", serif;

      font-size: 15px;
      line-height: 1.3;

      font-weight: 600;

      color: var(--blue-dark);
    }


    .status-note {
      margin-top: 3px;

      font-size: 12px;
      line-height: 1.35;

      color: var(--text-soft);
    }


    /* loader */

    .loader {
      display: none;

      width: 29px;
      height: 29px;

      flex: 0 0 29px;

      border: 3px solid rgba(141, 179, 213, 0.18);

      border-top-color: var(--blue-dark);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }


    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* =======================================
       FOOTER
    ======================================= */

    .footer-divider {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      width: 125px;

      margin: 14px auto 8px;
    }


    .footer-divider::before,
    .footer-divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: var(--beige);
    }


    .footer-divider svg {
      width: 14px;
      height: 14px;

      color: var(--blue);
    }


    .footer-note {
      font-family: Georgia, "Times New Roman", serif;

      font-size: 12.5px;

      font-style: italic;

      color: #72777d;
    }


    /* =======================================
       STAREA DE UPLOAD
    ======================================= */

    .uploading .btn-upload {
      opacity: 0.6;
      pointer-events: none;
    }


    /* =======================================
       LAPTOPURI MAI MICI
    ======================================= */

    @media (max-height: 750px) and (min-width: 701px) {

      body {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .container {
        padding-top: 21px;
        padding-bottom: 16px;
      }

      .eyebrow {
        margin-bottom: 8px;
      }

      .top-divider {
        margin-bottom: 10px;
      }

      h1 {
        font-size: 48px;
      }

      .title-dot {
        margin: 9px auto 9px;
      }

      .subtitle {
        font-size: 15px;
      }

      .button-group {
        margin-top: 17px;
      }

      .btn-upload {
        min-height: 158px;

        padding-top: 14px;
        padding-bottom: 13px;
      }

      .icon-wrap {
        width: 48px;
        height: 48px;

        margin-bottom: 9px;
      }

      .icon-wrap svg {
        width: 25px;
        height: 25px;
      }

      .btn-title {
        font-size: 19px;
      }

      .btn-subtitle {
        margin-bottom: 10px;
      }

      .status-card {
        min-height: 64px;
        margin-top: 14px;
      }

      .footer-divider {
        margin-top: 10px;
      }
    }


    /* =======================================
       TELEFON
    ======================================= */

    @media (max-width: 700px) {

      body {
        min-height: 100vh;

        align-items: flex-start;

        padding: 12px;
      }


      .background-decoration {
        opacity: 0.16;

        width: 150px;
        height: 280px;
      }


      .container {
        width: 100%;

        padding: 25px 16px 18px;

        border-radius: 22px;
      }


      .eyebrow {
        font-size: 10px;

        letter-spacing: 0.24em;

        margin-bottom: 9px;
      }


      .top-divider {
        width: 185px;

        margin-bottom: 13px;
      }


      h1 {
        font-size: 39px;
      }


      .title-dot {
        margin: 10px auto;
      }


      .subtitle {
        max-width: 300px;

        font-size: 14px;
      }


      .button-group {
        grid-template-columns: 1fr;

        gap: 12px;

        margin-top: 19px;
      }


      .btn-upload {
        min-height: auto;

        display: grid;

        grid-template-columns: 48px 1fr;

        column-gap: 13px;

        padding: 14px;

        text-align: left;
      }


      .icon-wrap {
        grid-row: 1 / 4;

        width: 48px;
        height: 48px;

        margin: 0;

        align-self: center;
      }


      .icon-wrap svg {
        width: 24px;
        height: 24px;
      }


      .btn-title {
        margin: 0 0 2px;

        font-size: 18px;
      }


      .btn-subtitle {
        margin: 0 0 9px;

        font-size: 12px;
      }


      .btn-action {
        padding: 8px 9px;

        text-align: center;

        font-size: 10px;
      }


      .status-card {
        min-height: 67px;

        margin-top: 13px;

        padding: 11px 12px;
      }


      .status-icon {
        width: 39px;
        height: 39px;

        flex-basis: 39px;
      }


      #status {
        font-size: 14px;
      }


      .status-note {
        font-size: 11px;
      }


      .footer-divider {
        margin-top: 12px;
      }


      .footer-note {
        font-size: 11.5px;
      }
    }


    @media (max-width: 380px) {

      h1 {
        font-size: 34px;
      }

      .btn-title {
        font-size: 17px;
      }

      .container {
        padding-left: 13px;
        padding-right: 13px;
      }

    }

  </style>
</head>

  <script>
  
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxKNqD2-PM3lweByRp8l-fdsiM5BYrRdsFxsMMu20J_v0HgZj9QaWN_bz0U0BLOCZG1/exec";
  
    const UPLOAD_TOKEN =
      "NUNTA-2026-IOANA-UPLOAD-8xK4mP2q";
  
  
    const appContainer =
      document.getElementById("appContainer");
  
    const status =
      document.getElementById("status");
  
    const statusNote =
      document.getElementById("statusNote");
  
    const loader =
      document.getElementById("loader");
  
    const statusIcon =
      document.getElementById("statusIcon");
  
  
    /*
      ============================
      STAREA INIȚIALĂ
      ============================
    */
  
    function setIdleState(
      message = "Nu ai selectat încă niciun fișier.",
      note = "Poți trimite o poză sau un video direct de pe telefon."
    ) {
  
      appContainer.classList.remove("uploading");
  
      loader.style.display = "none";
      statusIcon.style.display = "flex";
  
      status.innerText = message;
      statusNote.innerText = note;
    }
  
  
    /*
      ============================
      UPLOAD ÎN CURS
      ============================
    */
  
    function setUploadingState(fileName) {
  
      appContainer.classList.add("uploading");
  
      statusIcon.style.display = "none";
      loader.style.display = "block";
  
      status.innerText =
        "Se pregătește fișierul...";
  
      statusNote.innerText =
        fileName
          ? `Fișier selectat: ${fileName}`
          : "Te rugăm să aștepți.";
    }
  
  
    /*
      ============================
      SUCCES
      ============================
    */
  
    function setSuccessState() {
  
      appContainer.classList.remove("uploading");
  
      loader.style.display = "none";
      statusIcon.style.display = "flex";
  
      status.innerText =
        "Gata! Fișierul a fost trimis.";
  
      statusNote.innerText =
        "Poți încărca și alte poze sau videoclipuri.";
    }
  
  
    /*
      ============================
      EROARE
      ============================
    */
  
    function setErrorState(message) {
  
      appContainer.classList.remove("uploading");
  
      loader.style.display = "none";
      statusIcon.style.display = "flex";
  
      status.innerText =
        "Upload nereușit";
  
      statusNote.innerText =
        message || "Încearcă din nou.";
    }
  
  
    function resetInput(input) {
      input.value = "";
    }
  
  
    /*
      ==================================================
      TRIMITEREA FIȘIERULUI DIRECT CĂTRE GOOGLE DRIVE
      ==================================================
    */
  
    function uploadDirectToDrive(
      sessionUrl,
      file,
      input
    ) {
  
      const xhr =
        new XMLHttpRequest();
  
  
      xhr.open(
        "PUT",
        sessionUrl,
        true
      );
  
  
      xhr.setRequestHeader(
        "Content-Type",
        file.type ||
        "application/octet-stream"
      );
  
  
      /*
        PROGRES REAL AL UPLOADULUI
      */
  
      xhr.upload.onprogress =
        function (event) {
  
          if (!event.lengthComputable) {
            return;
          }
  
          const percent =
            Math.round(
              (event.loaded / event.total) *
              100
            );
  
  
          status.innerText =
            "Se trimite fișierul... " +
            percent +
            "%";
  
          statusNote.innerText =
            file.name;
        };
  
  
      /*
        UPLOAD TERMINAT
      */
  
      xhr.onload =
        function () {
  
          if (
            xhr.status >= 200 &&
            xhr.status < 300
          ) {
  
            setSuccessState();
  
            resetInput(input);
  
          } else {
  
            console.error(
              "Drive upload error:",
              xhr.status,
              xhr.responseText
            );
  
            setErrorState(
              "Google Drive nu a putut salva fișierul."
            );
  
            resetInput(input);
          }
        };
  
  
      /*
        PROBLEMĂ DE REȚEA
      */
  
      xhr.onerror =
        function () {
  
          console.error(
            "Eroare de rețea la upload."
          );
  
          setErrorState(
            "Conexiunea s-a întrerupt. Încearcă din nou."
          );
  
          resetInput(input);
        };
  
  
      /*
        TRIMITEM FIȘIERUL ORIGINAL.
  
        NU Base64.
        NU FileReader.
        NU iframe.
        NU formular ascuns.
      */
  
      xhr.send(file);
    }
  
  
    /*
      ==================================================
      FIȘIER SELECTAT
      ==================================================
    */
  
    function handleFileSelect(input) {
  
      const file =
        input.files[0];
  
  
      if (!file) {
        return;
      }
  
  
      setUploadingState(
        file.name
      );
  
  
      /*
        Creăm un nume unic pentru callback-ul
        pe care Apps Script îl va apela.
      */
  
      const callbackName =
        "driveUploadCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );
  
  
      /*
        Callback primit de la Apps Script.
      */
  
      window[callbackName] =
        function (response) {
  
  
          /*
            Ștergem script-ul JSONP
            după ce și-a făcut treaba.
          */
  
          if (script.parentNode) {
            script.remove();
          }
  
  
          delete window[callbackName];
  
  
          /*
            Verificăm dacă Apps Script
            ne-a dat sesiunea Drive.
          */
  
          if (
            !response ||
            !response.success ||
            !response.sessionUrl
          ) {
  
            console.error(
              "Eroare inițializare upload:",
              response
            );
  
  
            setErrorState(
              response &&
              response.error
  
                ? response.error
  
                : "Nu s-a putut porni uploadul."
            );
  
  
            resetInput(input);
  
            return;
          }
  
  
          /*
            Avem sessionUrl.
  
            De aici fișierul pleacă
            DIRECT către Google Drive.
          */
  
          uploadDirectToDrive(
            response.sessionUrl,
            file,
            input
          );
        };
  
  
      /*
        Parametrii trimiși către
        Apps Script.
      */
  
      const params =
        new URLSearchParams({
  
          action: "start",
  
          token:
            UPLOAD_TOKEN,
  
          name:
            file.name,
  
          type:
            file.type ||
            "application/octet-stream",
  
          size:
            file.size.toString(),
  
          callback:
            callbackName
        });
  
  
      /*
        JSONP:
        încărcăm Apps Script printr-un
        <script> temporar.
      */
  
      const script =
        document.createElement(
          "script"
        );
  
  
      script.src =
        API_URL +
        "?" +
        params.toString();
  
  
      /*
        Dacă nici măcar Apps Script
        nu poate fi accesat.
      */
  
      script.onerror =
        function () {
  
          delete window[callbackName];
  
  
          if (script.parentNode) {
            script.remove();
          }
  
  
          setErrorState(
            "Nu s-a putut porni uploadul. Încearcă din nou."
          );
  
  
          resetInput(input);
        };
  
  
      document.body.appendChild(
        script
      );
    }
  
  
    /*
      ============================
      BUTON CAMERA
      ============================
    */
  
    document
      .getElementById("fileCamera")
      .addEventListener(
        "change",
        function () {
  
          handleFileSelect(this);
        }
      );
  
  
    /*
      ============================
      BUTON GALERIE
      ============================
    */
  
    document
      .getElementById("fileGallery")
      .addEventListener(
        "change",
        function () {
  
          handleFileSelect(this);
        }
      );
  
  
    /*
      ============================
      PORNIRE PAGINĂ
      ============================
    */
  
    setIdleState();
  
  </script>

</body>
</html>
